<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Inventory — Haven')}"></head>
<body>
<div class="bg-atmosphere"></div>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="app-column">
    <div th:replace="~{fragments :: topbar}"></div>
    <main class="app-main">
    <div class="app-top">
      <div>
        <h1>Inventory</h1>
        <p>Clinic supplies and pharmacy stock.</p>
      </div>
    </div>
    <div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>
    <section class="panel" style="margin-bottom:1rem">
      <div class="panel-head"><h2>Add supply</h2></div>
      <div class="panel-body">
        <form class="form-inline" th:action="@{/app/inventory}" method="post">
          <div class="field"><label>Name</label><input name="name" required/></div>
          <div class="field"><label>Category</label>
            <select name="category"><option>PPE</option><option>Pharmacy</option><option>First Aid</option><option>Lab</option><option>Other</option></select>
          </div>
          <div class="field"><label>Quantity</label><input name="quantity" type="number" min="0" required/></div>
          <div class="field"><label>Unit</label><input name="unit" value="pcs"/></div>
          <div class="field"><label>Reorder level</label><input name="reorderLevel" type="number" min="0" value="10"/></div>
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Stock list</h2></div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Reorder at</th><th></th></tr></thead>
          <tbody>
            <tr th:each="s : ${supplies}">
              <td th:text="${s.name}">Name</td>
              <td th:text="${s.category}">Cat</td>
              <td th:text="${s.quantity + ' ' + s.unit}">0</td>
              <td>
                <span th:if="${s.quantity &lt;= s.reorderLevel}" class="badge badge-overdue">Low stock</span>
                <span th:unless="${s.quantity &lt;= s.reorderLevel}" th:text="${s.reorderLevel}">10</span>
              </td>
              <td>
                <form th:action="@{/app/inventory/delete}" method="post">
                  <input type="hidden" name="id" th:value="${s.id}"/>
                  <button class="btn btn-danger btn-sm" type="submit">Remove</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(supplies)}">No supplies yet.</p>
      </div>
    </section>
  </main>
  </div>
</div>
</body>
</html>
