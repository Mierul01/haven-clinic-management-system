<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Billing — Haven')}"></head>
<body>
<div class="bg-atmosphere"></div>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="app-column">
    <div th:replace="~{fragments :: topbar}"></div>
    <main class="app-main">
    <div class="app-top">
      <div>
        <h1>Billing</h1>
        <p>Next bill: <span th:text="${nextNumber}">BILL-0001</span></p>
      </div>
    </div>
    <div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>
    <div class="stat-row" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat"><div class="label">Paid</div><div class="value" th:text="'RM ' + ${#numbers.formatDecimal(paidTotal, 1, 0)}">RM 0</div></div>
      <div class="stat"><div class="label">Outstanding</div><div class="value" th:text="'RM ' + ${#numbers.formatDecimal(outstandingTotal, 1, 0)}">RM 0</div></div>
    </div>
    <section class="panel" style="margin-bottom:1rem">
      <div class="panel-head"><h2>Create bill</h2></div>
      <div class="panel-body">
        <form class="form-inline" th:action="@{/app/billing}" method="post">
          <div class="field"><label>Description</label><input name="description" required placeholder="Consultation"/></div>
          <div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" min="0" required/></div>
          <div class="field"><label>Patient</label>
            <select name="patientId"><option value="">—</option><option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}"></option></select>
          </div>
          <div class="field"><label>Status</label>
            <select name="status">
              <option value="PENDING">Pending</option>
              <option value="PAID">Paid</option>
              <option value="OVERDUE">Overdue</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Create</button>
        </form>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Bills</h2></div>
      <div class="panel-body">
        <table>
          <thead><tr><th>#</th><th>Patient</th><th>Description</th><th>Amount</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="b : ${bills}">
              <td th:text="${b.number}">BILL</td>
              <td th:text="${b.patient != null ? b.patient.fullName : '—'}">Patient</td>
              <td th:text="${b.description}">Desc</td>
              <td th:text="'RM ' + ${b.amount}">RM 0</td>
              <td>
                <form th:action="@{/app/billing/status}" method="post">
                  <input type="hidden" name="id" th:value="${b.id}"/>
                  <select name="status" onchange="this.form.submit()">
                    <option value="PENDING" th:selected="${b.status=='PENDING'}">Pending</option>
                    <option value="PAID" th:selected="${b.status=='PAID'}">Paid</option>
                    <option value="OVERDUE" th:selected="${b.status=='OVERDUE'}">Overdue</option>
                  </select>
                </form>
              </td>
              <td>
                <form th:action="@{/app/billing/delete}" method="post">
                  <input type="hidden" name="id" th:value="${b.id}"/>
                  <button class="btn btn-danger btn-sm" type="submit">Remove</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(bills)}">No bills yet.</p>
      </div>
    </section>
  </main>
  </div>
</div>
</body>
</html>
