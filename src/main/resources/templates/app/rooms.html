<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rooms — Haven')}"></head>
<body>
<div class="bg-atmosphere"></div>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar}"></div>
  <main class="app-main">
    <div class="app-top">
      <div>
        <button class="mobile-toggle" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button>
        <h1>Rooms</h1>
        <p>Consultation rooms, wards, and lab spaces.</p>
      </div>
    </div>
    <div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>
    <section class="panel" style="margin-bottom:1rem">
      <div class="panel-head"><h2>Add room</h2></div>
      <div class="panel-body">
        <form class="form-inline" th:action="@{/app/rooms}" method="post">
          <div class="field"><label>Name</label><input name="name" required placeholder="Consult 1"/></div>
          <div class="field"><label>Type</label>
            <select name="type">
              <option value="CONSULTATION">Consultation</option>
              <option value="WARD">Ward</option>
              <option value="ICU">ICU</option>
              <option value="LAB">Lab</option>
            </select>
          </div>
          <div class="field"><label>Status</label>
            <select name="status">
              <option value="AVAILABLE">Available</option>
              <option value="OCCUPIED">Occupied</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
          </div>
          <div class="field"><label>Capacity</label><input name="capacity" type="number" min="1" value="1"/></div>
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Room board</h2></div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Room</th><th>Type</th><th>Capacity</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="r : ${rooms}">
              <td th:text="${r.name}">Name</td>
              <td th:text="${#strings.replace(r.type, '_', ' ')}">Type</td>
              <td th:text="${r.capacity}">1</td>
              <td>
                <form th:action="@{/app/rooms/status}" method="post">
                  <input type="hidden" name="id" th:value="${r.id}"/>
                  <select name="status" onchange="this.form.submit()">
                    <option value="AVAILABLE" th:selected="${r.status=='AVAILABLE'}">Available</option>
                    <option value="OCCUPIED" th:selected="${r.status=='OCCUPIED'}">Occupied</option>
                    <option value="MAINTENANCE" th:selected="${r.status=='MAINTENANCE'}">Maintenance</option>
                  </select>
                </form>
              </td>
              <td>
                <form th:action="@{/app/rooms/delete}" method="post">
                  <input type="hidden" name="id" th:value="${r.id}"/>
                  <button class="btn btn-danger btn-sm" type="submit">Remove</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(rooms)}">No rooms yet.</p>
      </div>
    </section>
  </main>
</div>
</body>
</html>
