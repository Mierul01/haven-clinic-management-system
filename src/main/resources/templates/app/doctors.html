<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Doctors — Haven')}"></head>
<body>
<div class="bg-atmosphere"></div>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar}"></div>
  <main class="app-main">
    <div class="app-top">
      <div>
        <button class="mobile-toggle" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button>
        <h1>Doctors</h1>
        <p>Your care team.</p>
      </div>
    </div>
    <div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>
    <section class="panel" style="margin-bottom:1rem">
      <div class="panel-head"><h2>Add doctor</h2></div>
      <div class="panel-body">
        <form class="form-inline" th:action="@{/app/doctors}" method="post">
          <div class="field"><label>Full name</label><input name="fullName" required placeholder="Dr. Name"/></div>
          <div class="field"><label>Specialty</label><input name="specialty" required placeholder="General Practice"/></div>
          <div class="field"><label>Phone</label><input name="phone"/></div>
          <div class="field"><label>Email</label><input name="email" type="email"/></div>
          <div class="field"><label>Status</label>
            <select name="status">
              <option value="ACTIVE">Active</option>
              <option value="ON_LEAVE">On Leave</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Doctor roster</h2></div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Name</th><th>Specialty</th><th>Phone</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="d : ${doctors}">
              <td th:text="${d.fullName}">Name</td>
              <td th:text="${d.specialty}">Specialty</td>
              <td th:text="${d.phone}">Phone</td>
              <td><span class="badge" th:classappend="' badge-' + ${#strings.toLowerCase(d.status)}" th:text="${#strings.replace(d.status, '_', ' ')}">Active</span></td>
              <td>
                <form th:action="@{/app/doctors/delete}" method="post">
                  <input type="hidden" name="id" th:value="${d.id}"/>
                  <button class="btn btn-danger btn-sm" type="submit">Remove</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(doctors)}">No doctors yet.</p>
      </div>
    </section>
  </main>
</div>
</body>
</html>
