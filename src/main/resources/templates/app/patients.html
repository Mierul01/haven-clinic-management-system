<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Patients — Haven')}"></head>
<body>
<div class="bg-atmosphere"></div>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="app-column">
    <div th:replace="~{fragments :: topbar}"></div>
    <main class="app-main">
    <div class="app-top">
      <div>
        <h1>Patients</h1>
        <p>People under your clinic’s care.</p>
      </div>
    </div>
    <div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>
    <section class="panel" style="margin-bottom:1rem">
      <div class="panel-head"><h2>Add patient</h2></div>
      <div class="panel-body">
        <form class="form-inline" th:action="@{/app/patients}" method="post">
          <div class="field"><label>Full name</label><input name="fullName" required/></div>
          <div class="field"><label>Age</label><input name="age" type="number" min="0"/></div>
          <div class="field"><label>Gender</label><select name="gender"><option>Female</option><option>Male</option><option>Other</option></select></div>
          <div class="field"><label>Phone</label><input name="phone"/></div>
          <div class="field"><label>Blood type</label><select name="bloodType"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
          <div class="field"><label>Allergies</label><input name="allergies" placeholder="Tiada direkodkan"/></div>
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Patient list</h2></div>
      <div class="panel-body">
        <table>
          <thead><tr><th>Name</th><th>Age</th><th>Blood</th><th>Phone</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="p : ${patients}">
              <td th:text="${p.fullName}">Name</td>
              <td th:text="${p.age}">0</td>
              <td th:text="${p.bloodType}">A+</td>
              <td th:text="${p.phone}">Phone</td>
              <td><span class="badge" th:classappend="' badge-' + ${#strings.toLowerCase(p.status)}" th:text="${#strings.replace(p.status, '_', ' ')}">Active</span></td>
              <td>
                <form th:action="@{/app/patients/delete}" method="post">
                  <input type="hidden" name="id" th:value="${p.id}"/>
                  <button class="btn btn-danger btn-sm" type="submit">Remove</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(patients)}">No patients yet.</p>
      </div>
    </section>
  </main>
  </div>
</div>
</body>
</html>
