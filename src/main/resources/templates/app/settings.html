<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Profile — Haven')}"></head>
<body>
<div class="bg-atmosphere"></div>
<div class="app-shell">
  <div th:replace="~{fragments :: sidebar}"></div>
  <div class="app-column">
    <div th:replace="~{fragments :: topbar}"></div>
    <main class="app-main">
    <div class="app-top">
      <div>
        <h1>Profile</h1>
        <p>Manage how your clinic appears in Haven.</p>
      </div>
    </div>

    <div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>

    <section class="profile-hero">
      <div class="profile-hero-avatar" th:text="${#strings.substring(currentUser.fullName,0,1)}">D</div>
      <div class="profile-hero-copy">
        <h2 th:text="${currentUser.fullName}">Doctor</h2>
        <p th:text="${currentUser.companyName}">Clinic</p>
        <div class="profile-hero-meta">
          <span th:text="${currentUser.email}">email</span>
          <span class="profile-plan" th:text="${currentUser.plan}">CLINIC</span>
        </div>
      </div>
    </section>

    <section class="profile-card">
      <div class="profile-card-head">
        <h3>Clinic details</h3>
        <p>Update your name and clinic information.</p>
      </div>
      <form class="profile-form" th:action="@{/app/settings}" method="post">
        <div class="profile-form-grid">
          <div class="field">
            <label>Your name</label>
            <input name="fullName" th:value="${currentUser.fullName}" required/>
          </div>
          <div class="field">
            <label>Clinic / hospital name</label>
            <input name="companyName" th:value="${currentUser.companyName}"/>
          </div>
          <div class="field">
            <label>Email</label>
            <input th:value="${currentUser.email}" disabled/>
          </div>
          <div class="field">
            <label>Plan</label>
            <input th:value="${currentUser.plan}" disabled/>
          </div>
        </div>
        <div class="profile-form-actions">
          <button class="btn btn-primary" type="submit">Save changes</button>
        </div>
      </form>
    </section>

    <section class="profile-session">
      <div>
        <h3>Session</h3>
        <p>Sign out of Haven on this device.</p>
      </div>
      <button type="button" class="btn btn-danger" data-logout-trigger>Sign out</button>
    </section>
  </main>
  </div>
</div>
</body>
</html>
